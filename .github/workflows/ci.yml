name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id "ci" is the required status check on main (see mgpl-diagnostics/.github scripts/protect-repos.mjs).
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # @mgpl-diagnostics/client comes from GitHub Packages. Switch to `npm ci` once package-lock.json is committed.
      - uses: mgpl-diagnostics/.github/actions/node@claude/project-thread-dsh6g4
        with:
          github-packages: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          install: npm install --no-audit --no-fund
      # Next.js's incremental build cache (compiled modules survive between runs)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.css', '!node_modules/**', '!.next/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}-
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          MGPL_API_URL: http://localhost:4000
